<!-- Opt-in social image (needs a photo). Styled by covers.css (.photo-forward). -->
<div class="cover photo photo-forward">
  <img class="bg" src="{{image}}" />

  <div class="corner">
    <div class="corner-square"></div>
    <div class="site">{{site}}</div>
  </div>

  <div class="title-bar">
    <div class="title">{{title}}</div>
  </div>
</div>
